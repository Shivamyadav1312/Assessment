$kind: http-request
description: Delete a product by ID.
url: "{{baseUrl}}/products/{{productId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
