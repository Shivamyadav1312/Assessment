$kind: http-request
description: Partially update product price, stock, or description.
url: "{{baseUrl}}/products/{{productId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "price": 64999,
      "stockQuantity": 15
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Price and stock updated", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data.price).to.eql(64999);
          pm.expect(jsonData.data.stockQuantity).to.eql(15);
      });
    language: text/javascript
order: 7000
