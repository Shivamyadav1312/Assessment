$kind: http-request
description: Filter products by category name.
url: "{{baseUrl}}/products?category=electronics"
method: GET
queryParams:
  category: electronics
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
